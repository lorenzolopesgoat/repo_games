<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-SERPENT 2099</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1 class="neon-title">CYBER<span>SERPENT</span></h1>
        </header>

        <div class="hud-panel">
            <div class="hud-box">
                <span class="label">SCORE</span>
                <span id="score" class="value">0000</span>
            </div>
            <div class="hud-box">
                <span class="label">MAPA</span>
                <span id="map-name" class="value alt">1: ARENA ABERTA</span>
            </div>
            <div class="hud-box">
                <span class="label">RECORD</span>
                <span id="high-score" class="value">0000</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
            <div id="overlay-message" class="overlay-screen">
                <div class="card-dialog">
                    <h2 id="msg-title">SISTEMA PRONTO</h2>
                    <p id="message">Pressione W, A, S, D ou SETAS para iniciar o link neural</p>
                </div>
            </div>
        </div>

        <div class="instructions">
            <span>🎮 <strong>Movimento:</strong> WASD / Setas</span>
            <span>🗺️ <strong>Selecionar Mapa:</strong> Tecla [1] ou [2]</span>
        </div>

        <button id="restart-btn" onclick="restartGame()">RESTART SYSTEM</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
