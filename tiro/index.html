<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardião da Base</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Guardião da Base</h1>
        <p class="help">Mover: ← → ou A/D · Atirar: Espaço · Pausar: P · Reiniciar: R</p>

        <div class="hud" aria-live="polite">
            <span>Pontos <strong id="score">0</strong></span>
            <span>Onda <strong id="wave">1</strong></span>
            <span>Vidas <strong id="lives">3</strong></span>
        </div>

        <canvas id="game" width="480" height="640" aria-label="Área do jogo Guardião da Base"></canvas>

        <p class="rule">Inimigo que passa pela linha de baixo tira 1 vida.</p>
    </main>
    <script src="game.js"></script>
</body>
</html>
